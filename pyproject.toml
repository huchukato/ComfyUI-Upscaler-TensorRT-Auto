[project]
name = "upscaler-tensorrt-auto"
description = "2-4x faster ComfyUI image upscaling using TensorRT with automatic installation and model optimization. Supports popular upscaling models with automatic TensorRT engine building, CUDA toolkit detection, and memory-efficient processing. Enhanced performance and stability over original implementation."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["# Base dependencies - TensorRT will be auto-installed based on CUDA detection", "# The node will automatically detect CUDA 12/13 and install appropriate TensorRT packages", "#", "# Installation happens automatically when the node loads for the first time", "# No manual TensorRT installation required!", "# Base dependencies that work with any CUDA version", "einops", "colored", "polygraphy", "cuda-python", "requests", "tqdm", "# Note: TensorRT packages are auto-installed on first node load:", "# CUDA 13: tensorrt_cu13==10.15.1.29 (RTX 50 series)", "# CUDA 12: tensorrt-cu12==10.13.3.9 (RTX 30/40 series)", "#", "# Manual installation files are provided for reference only:", "# - requirements_cu12.txt (CUDA 12 specific)", "# - requirements_cu13.txt (CUDA 13 specific)"]

[project.urls]
Repository = "https://github.com/huchukato/ComfyUI-Upscaler-TensorRT-Auto"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/huchukato/ComfyUI-Upscaler-TensorRT-Auto/wiki"
"Bug Tracker" = "https://github.com/huchukato/ComfyUI-Upscaler-TensorRT-Auto/issues"

