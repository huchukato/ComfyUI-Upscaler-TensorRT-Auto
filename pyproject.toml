[project]
name = "Auto-TensorRT-Upscaler"
version = "1.1.3"
description = "Fast image upscaling for ComfyUI using TensorRT acceleration (2-4x faster than standard methods). Auto-detects CUDA version and installs matching TensorRT wheels. Supports multiple upscaling models with automatic engine building and optimized inference for NVIDIA GPUs."
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/huchukato/ComfyUI-Upscaler-TensorRT-Auto"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.comfy]
PublisherId = "huchukato"
DisplayName = "Auto TensorRT Upscaler"
Icon = "https://raw.githubusercontent.com/huchukato/ComfyUI-Upscaler-TensorRT-Auto/master/icon.png"
Banner = "https://raw.githubusercontent.com/huchukato/ComfyUI-Upscaler-TensorRT-Auto/master/banner.png"
