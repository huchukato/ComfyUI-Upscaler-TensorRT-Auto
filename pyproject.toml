[project]
name = "upscaler-tensorrt-auto"
version = "1.0.0"
description = "ComfyUI custom node for fast image upscaling with automatic CUDA/TensorRT detection"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/huchukato/ComfyUI-Upscaler-TensorRT-Auto"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.comfy]
PublisherId = "huchukato"
DisplayName = "Upscaler TensorRT Auto"
Icon = ""
